apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  labels:
    app: api-server
spec:
  replicas: {{ .Values.api.replicas}}
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - api-server
            namespaces: 
            - retrosync-dev
            - retrosync-preprod
            - retrosync-prod
            topologyKey: "kubernetes.io/hostname"
      containers:
      - name: fastapi-container
        image: {{ .Values.version.api.name }}:{{ .Values.version.api.tag }}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        envFrom:
        - secretRef:
            name: mysql-variables
        resources:
          limits:
            memory: {{ .Values.deployment.resources.limits.memory}}
            cpu: {{ .Values.deployment.resources.limits.cpu}}
          requests: 
            memory: {{ .Values.deployment.resources.requests.memory}}
            cpu: {{ .Values.deployment.resources.requests.cpu}}