deployment:
  resources:
    limits:
      memory: 500Mi
      cpu: "250m"
    requests:
      memory: 150m
      cpu: "100m"       
database:
  nodePort: 32001
  replicas: 1

statefulset:
  name: mysql-statefulset-preprod

PersistentVolume:
  metadata:
    name: mysql-pv-preprod
  claimRef:
    name: mysql-data-mysql-statefulset-preprod-0
    namespace: retrosync-preprod