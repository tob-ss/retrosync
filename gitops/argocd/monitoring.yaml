apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
spec:
  destination:
    namespace: retrosync-dev
    server: https://kubernetes.default.svc
  source:
    path: monitoring
    repoURL: https://github.com/tob-ss/retrosync
    targetRevision: new_main
  sources: []
  project: retrosync
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
      enabled: true
    syncOptions:
      - CreateNamespace=true