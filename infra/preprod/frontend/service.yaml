apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: preproduction
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30040
  type: NodePort