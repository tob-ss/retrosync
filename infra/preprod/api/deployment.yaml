apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: preproduction
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: 8080
  labels:
    app: api-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      containers:
      - name: fastapi-container
        image: tobsss/api-preprod:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        envFrom:
        - secretRef:
            name: mysql-variables