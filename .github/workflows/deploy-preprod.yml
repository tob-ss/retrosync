name: Deploy to Server

on:
  push:
    branches:
      - feat/phase2-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_DEPLOY_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts
    - name: Deploy to server
      run: |
        echo "Starting deployment.."
        echo "SSHing into server"
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << EOF
          echo "Moving to retrosync directory"
          cd /retrosync/retrosync

          # Set GitHub credentials using GITHUB_TOKEN
          echo "Setting Github Credentials"
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" > ~/.git-credentials

          # Pull the latest code from the repository
          echo "Pulling code"
          git pull origin feat/phase2-frontend

          # Docker compose down
          echo "Docker compose down"
          docker compose down

          # Docker compose build
          echo "Docker compose build"
          docker compose build

          # Docker compose up
          echo "Docker compose up"
          docker compose up
        echo "Finished deployment!"
        EOF
